apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: test-set
  namespace: openshift-gitops
  labels:
    velero.io/exclude-from-backup: "false"
spec:
  generators:
  - git:
      repoURL: https://github.com/vlewisRH/rhug_demo.git
      revision: test-branch
      directories:
      - path: "apps/console-banner"
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'demo-app'
      labels:
        app: argo-apps
        velero.io/exclude-from-backup: "false"
    spec:
      project: default
      source:
        path: apps/console-banner
        repoURL: https://github.com/vlewisRH/rhug_demo.git
        targetRevision: test-branch
        helm:
          parameters:
            - name: "cluster_name"
              value: "test-app"
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops