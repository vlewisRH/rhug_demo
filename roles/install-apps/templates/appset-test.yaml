apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: test-set
  namespace: openshift-gitops
  labels:
    apps: test-apps
spec:
  generators:
  - git:
      repoURL: https://github.com/vlewisRH/rhug_demo.git
      revision: test-branch
      directories:
      - path: "apps/console-banner"
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'demo-app'
      namespace: banner-ns
      labels:
        app: test-app
    spec:
      project: default
      source:
        path: apps/console-banner
        repoURL: https://github.com/vlewisRH/rhug_demo.git
        targetRevision: test-branch
        helm:
          parameters:
            - name: "cluster_name"
              value: "test-app"
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
        - RespectIgnoreDifferences=true
        - CreateNamespace=true
      destination:
        server: https://kubernetes.default.svc
        namespace: default